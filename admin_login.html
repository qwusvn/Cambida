<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị · {{ site.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bg: {{ site.theme.background }}; --surface: {{ site.theme.surface }}; --primary: {{ site.theme.primary }}; --accent: {{ site.theme.accent }}; --text: {{ site.theme.text }}; }
    body { min-height:100vh; display:grid; place-items:center; padding:20px; color:var(--text); background:radial-gradient(circle at top, var(--surface), var(--bg) 60%); }
    .login { width:min(100%,390px); background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:28px; box-shadow:0 18px 45px rgba(0,0,0,.28); }
    .form-control { background:rgba(0,0,0,.2); color:var(--text); border-color:rgba(255,255,255,.25); } .form-control:focus { background:rgba(0,0,0,.3); color:var(--text); border-color:var(--accent); }
    .btn-brand { width:100%; background:var(--primary); color:#fff; border:0; } .btn-brand:hover { background:var(--accent); color:#111; }
  </style>
</head>
<body>
  <form class="login" method="post">
    <h1 class="h4 text-center mb-2">⚙️ Quản trị</h1>
    <p class="text-center opacity-75 mb-4">{{ site.name }}</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
    <div class="mb-4"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-brand" type="submit">Đăng nhập</button>
  </form>
</body>
</html>
