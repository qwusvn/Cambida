<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>{{ camera_name }} · {{ site.name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
	:root { --bg: {{ site.theme.background }}; --surface: {{ site.theme.surface }}; --primary: {{ site.theme.primary }}; --accent: {{ site.theme.accent }}; --text: {{ site.theme.text }}; }
	.btn-gradient {
	  background: linear-gradient(90deg, var(--primary), var(--accent));
	  border: none;
	  color: white;
	  font-weight: 600;
	  border-radius: 50px;
	  padding: 12px 28px;
	  transition: transform 0.2s;
	}
	.btn-gradient:hover {
	  transform: scale(1.05);
	  color: white;
	}
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .background {
      position: fixed;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      z-index: 0;
      top: 0;
      left: 0;
    }
    .background span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: color-mix(in srgb, var(--primary) 18%, transparent);
      animation: animate 25s linear infinite;
      bottom: -150px;
    }
    .background span:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-duration: 22s; }
    .background span:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-duration: 18s; }
    .background span:nth-child(3) { left: 25%; width: 50px; height: 50px; animation-duration: 28s; }
    .background span:nth-child(4) { left: 40%; width: 30px; height: 30px; animation-duration: 32s; }
    .background span:nth-child(5) { left: 70%; width: 90px; height: 90px; animation-duration: 24s; }
    .background span:nth-child(6) { left: 80%; width: 15px; height: 15px; animation-duration: 30s; }
    .background span:nth-child(7) { left: 65%; width: 25px; height: 25px; animation-duration: 20s; }
    .background span:nth-child(8) { left: 35%; width: 40px; height: 40px; animation-duration: 26s; }
    .background span:nth-child(9) { left: 50%; width: 10px; height: 10px; animation-duration: 22s; }
    .background span:nth-child(10) { left: 90%; width: 60px; height: 60px; animation-duration: 34s; }
    @keyframes animate {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 30px auto;
      padding-bottom: 100px;
    }
    video {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .btn-lg {
      font-size: 1.25rem;
      padding: 15px;
    }
    select, input[type="date"], input[type="time"] {
      background-color: var(--surface);
      color: var(--text);
    }
    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }
    img.stream {
      width: 100%;
      border-radius: 12px;
      max-height: 400px;
      object-fit: cover;
    }
    .highlighted-title {
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px var(--primary);
    }
    .merge-date-picker-wrap {
      position: relative;
      display: inline-block;
      min-width: 190px;
    }
    .merge-date-picker {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .merge-date-nav {
      border: 0;
      background: transparent;
      color: #ffc107;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1;
      padding: 0 8px;
      cursor: pointer;
    }
    .merge-date-nav:hover,
    .merge-date-nav:focus-visible {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="background">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="container">
    <div class="mb-4 text-center">
      <h4>{{ camera_name }}</h4>
      <img id="streamView" class="stream" src="/cam{{ cam_id }}">
    </div>

    <h2 class="highlighted-title text-center mb-4">{{ site.name }}</h2>

  <div class="row mb-3">
    <div class="col-md-6">
      <label for="filterDate" class="form-label">📅 Chọn ngày:</label>
      <input type="date" id="filterDate" class="form-control">
    </div>
    <div class="col-md-6">
      <label for="filterTime" class="form-label">🕑 Chọn giờ bắt đầu:</label>
      <input type="time" id="filterTime" class="form-control" step="60">
    </div>
  </div>

    <div class="mb-3">
      <label for="videoList" class="form-label">🎬 Chọn video:</label>
      <select id="videoList" class="form-select"><option selected disabled>Danh sách video sẽ hiển thị ở đây.</option></select>
    </div>
	<div>
	  <video id="videoPlayer" controls playsinline muted class="rounded shadow w-100 mb-2"></video>
	  <div id="codecWarning" class="alert alert-warning py-2" role="alert" style="display:none;"></div>
	  <div class="d-grid">
		<a id="downloadOriginalBtn" class="btn btn-warning btn-lg disabled" href="#" role="button" aria-disabled="true">
		   Tải đoạn này về máy
		</a>
	  </div>
	</div>

    <hr class="my-4">

    <h5 class="text-center">🔗 Ghép Video (Tối đa {{ max_merge_minutes }} phút)</h5>
    <div class="alert alert-info text-center" style="font-size: 0.9rem;">
      Chọn video nằm trong khoảng thời gian.
    </div>

    <div class="row mb-3 align-items-end">
      <div class="col-md-12 text-center mb-2">
        <button type="button" class="merge-date-nav" id="prevMergeDate" aria-label="Ngày trước">&lt;</button>
        <span class="badge bg-secondary merge-date-picker-wrap">
          Ngày: <span id="mergeDateDisplay" class="text-warning">Đang tải...</span>
          <input type="date" id="mergeDate" class="merge-date-picker" aria-label="Chọn ngày ghép" required>
        </span>
        <button type="button" class="merge-date-nav" id="nextMergeDate" aria-label="Ngày sau">&gt;</button>
      </div>
      <div class="col-6">
        <label class="form-label">⏱ Bắt đầu:</label>
        <input type="time" id="mergeStart" class="form-control" required>
      </div>
      <div class="col-6">
        <label class="form-label">🏁 Kết thúc:</label>
        <input type="time" id="mergeEnd" class="form-control" required>
      </div>
    </div>

    <div class="d-grid mb-2">
      <button class="btn btn-gradient btn-lg" onclick="mergeVideo()">Bắt đầu Ghép</button>
    </div>

    <div id="mergeProgressWrap" class="mb-3" style="display:none;">
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="mergeProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 0%">0%</div>
      </div>
      <p class="text-center text-white mt-1" id="mergeStatusText">Đang xử lý...</p>
    </div>

    <div id="mergeResult" class="text-center"></div>
  </div>

  <script>
    const CAMERA_MODE = "{{ camera_mode }}";
    let allVideos = [];
    let visibleVideos = [];
    let recentWindowMode = true;

    function getSelectedSource() {
      return CAMERA_MODE === "nvr" ? "nvr" : "local";
    }

    function isNvrSource() {
      return CAMERA_MODE === "nvr";
    }

    function getVideoName(video) {
      return String(video?.name || video?.filename || "");
    }

    function getPlayUrl(video) {
      return video?.url || `/video/${encodeURIComponent(getVideoName(video))}`;
    }

    function getDownloadUrl(video) {
      return video?.download_url || `/download/${encodeURIComponent(getVideoName(video))}`;
    }

    function getSelectedReplayStart() {
      const dateValue = document.getElementById("filterDate")?.value || "";
      const timeValue = (document.getElementById("filterTime")?.value || "").trim();
      if (!dateValue || !timeValue) return null;
      const value = new Date(`${dateValue}T${timeValue}`);
      return Number.isNaN(value.getTime()) ? null : value;
    }

    function formatLocalDateTime(value) {
      const pad = number => String(number).padStart(2, "0");
      return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())}T${pad(value.getHours())}:${pad(value.getMinutes())}:${pad(value.getSeconds())}`;
    }

    function appendQueryParam(url, key, value) {
      if (!value) return url;
      return `${url}${url.includes("?") ? "&" : "?"}${encodeURIComponent(key)}=${encodeURIComponent(value)}`;
    }

    function getVideoRange(video) {
      if (!video) return null;
      const startedAt = video.started_at ? new Date(video.started_at) : null;
      const endedAt = (video.end_at || video.ended_at) ? new Date(video.end_at || video.ended_at) : null;
      if (startedAt && endedAt && !Number.isNaN(startedAt.getTime()) && !Number.isNaN(endedAt.getTime()) && endedAt > startedAt) {
        return { start: startedAt, end: endedAt };
      }
      if (startedAt && !Number.isNaN(startedAt.getTime()) && Number(video.duration_sec) > 0) {
        return { start: startedAt, end: new Date(startedAt.getTime() + Number(video.duration_sec) * 1000) };
      }
      const name = getVideoName(video);
      const full = name.match(/cam\d+_(\d{2})-(\d{2})-(\d{2})_to_(\d{2})-(\d{2})-(\d{2})_\((\d{2})-(\d{2})-(\d{4})\)\.mp4$/i);
      if (!full) return null;
      const [, sh, sm, ss, eh, em, es, day, month, year] = full;
      const rangeStart = new Date(Number(year), Number(month) - 1, Number(day), Number(sh), Number(sm), Number(ss));
      const rangeEnd = new Date(Number(year), Number(month) - 1, Number(day), Number(eh), Number(em), Number(es));
      if (rangeEnd <= rangeStart) rangeEnd.setDate(rangeEnd.getDate() + 1);
      return { start: rangeStart, end: rangeEnd };
    }

    function updateVideoList() {
      const list = document.getElementById("videoList");
      const dlBtn = document.getElementById("downloadOriginalBtn");
      const selectedDate = document.getElementById("filterDate").value;
      const selectedTime = (document.getElementById("filterTime")?.value || "").trim();
      list.innerHTML = '<option selected disabled>Danh sách video sẽ hiển thị ở đây...</option>';

      visibleVideos = allVideos.filter(video => {
        const videoRange = getVideoRange(video);
        if (!videoRange || Number.isNaN(videoRange.start.getTime())) return false;

        if (recentWindowMode) {
          const now = new Date();
          const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
          return videoRange.end > oneHourAgo && videoRange.start <= now;
        }

        if (!selectedDate) return true;
        const rangeStart = new Date(`${selectedDate}T${selectedTime || "00:00"}`);
        const rangeEnd = new Date(`${selectedDate}T00:00`);
        rangeEnd.setDate(rangeEnd.getDate() + 1);
        return videoRange.end > rangeStart && videoRange.start < rangeEnd;
      });

      if (visibleVideos.length === 0) {
        const opt = document.createElement("option");
        opt.text = "Không có video cho ngày/giờ đã chọn.";
        opt.disabled = true;
        list.appendChild(opt);
        if (dlBtn) {
          dlBtn.classList.add("disabled");
          dlBtn.removeAttribute("href");
        }
        document.getElementById("videoPlayer").removeAttribute("src");
        return;
      }

      visibleVideos.forEach((video, videoIndex) => {
        const option = document.createElement("option");
        const range = getVideoRange(video);
        if (range) {
          const pad = value => String(value).padStart(2, "0");
          option.text = `${pad(range.start.getHours())}:${pad(range.start.getMinutes())}:${pad(range.start.getSeconds())} - ${pad(range.end.getHours())}:${pad(range.end.getMinutes())}:${pad(range.end.getSeconds())} (${pad(range.start.getDate())}/${pad(range.start.getMonth() + 1)}/${range.start.getFullYear()})`;
          option.dataset.startAt = range.start.toISOString();
        } else {
          option.text = getVideoName(video);
        }
        option.value = String(videoIndex);
        option.dataset.timelineIndex = String(videoIndex);
        list.appendChild(option);
      });

      let initialIndex = 0;
      const requestedStart = !recentWindowMode ? getSelectedReplayStart() : null;
      if (requestedStart) {
        const containingIndex = visibleVideos.findIndex(video => {
          const range = getVideoRange(video);
          return range && range.start <= requestedStart && requestedStart < range.end;
        });
        if (containingIndex >= 0) {
          initialIndex = containingIndex;
        } else {
          const nextCandidate = visibleVideos
            .map((video, index) => ({ index, range: getVideoRange(video) }))
            .filter(item => item.range && item.range.start >= requestedStart)
            .sort((a, b) => a.range.start - b.range.start)[0];
          if (nextCandidate) initialIndex = nextCandidate.index;
        }
      }

      list.onchange = () => selectVideo(Number(list.value));
      selectVideo(initialIndex);
    }

    function selectVideo(index) {
      const list = document.getElementById("videoList");
      const video = visibleVideos[index];
      if (!video) return;
      list.value = String(index);
      const filename = getVideoName(video);
      const player = document.getElementById("videoPlayer");
      const dlBtn = document.getElementById("downloadOriginalBtn");
      const codecWarning = document.getElementById("codecWarning");
      let playUrl = getPlayUrl(video);
      let downloadUrl = getDownloadUrl(video);
      const range = getVideoRange(video);
      const requestedStart = getSelectedReplayStart();
      if ((isNvrSource() || video.source === "nvr" || playUrl.startsWith("/nvr/")) && range) {
        const playbackStart = requestedStart && requestedStart > range.start && requestedStart < range.end
          ? requestedStart
          : range.start;
        const atValue = formatLocalDateTime(playbackStart);
        playUrl = appendQueryParam(playUrl, "at", atValue);
        downloadUrl = appendQueryParam(downloadUrl, "at", atValue);
      }
      player.src = playUrl;
      player.dataset.filename = filename;
      if (codecWarning) codecWarning.style.display = "none";
      if (dlBtn) {
        dlBtn.href = downloadUrl;
        dlBtn.classList.remove("disabled");
        dlBtn.setAttribute("download", filename || `camera-{{ cam_id }}.mp4`);
      }
      if (isNvrSource() || video.source === "nvr" || getPlayUrl(video).startsWith("/nvr/")) return;
      fetch("/api/video-codec/" + encodeURIComponent(filename))
        .then(res => res.ok ? res.json() : null)
        .then(info => {
          if (!info?.is_h265 || player.dataset.filename !== filename || !codecWarning) return;
          codecWarning.innerText = "⚠️ Video này dùng H.265/HEVC. Nhiều trình duyệt không phát được; hãy tải về xem bằng phần mềm hỗ trợ hoặc đổi camera sang H.264.";
          codecWarning.style.display = "block";
        })
        .catch(() => {});
    }

    function fetchVideos() {
      const dateInput = document.getElementById("filterDate");
      let url = `/list/cam{{ cam_id }}?source=${encodeURIComponent(getSelectedSource())}`;
      if (isNvrSource() && dateInput?.value) url += `&date=${encodeURIComponent(dateInput.value)}`;
      return fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`Không tải được danh sách video (${res.status}).`);
          return res.json();
        })
        .then(data => {
          allVideos = Array.isArray(data) ? data : (Array.isArray(data?.videos) ? data.videos : []);
          updateVideoList();
        })
        .catch(error => {
          allVideos = [];
          visibleVideos = [];
          document.getElementById("videoList").innerHTML = '<option selected disabled>Không tải được danh sách video. Hãy tải lại trang.</option>';
          const dlBtn = document.getElementById("downloadOriginalBtn");
          if (dlBtn) {
            dlBtn.classList.add("disabled");
            dlBtn.removeAttribute("href");
          }
          console.error("[Replay]", error);
        });
    }

    function mergeVideo() {
      const dateVal = document.getElementById("mergeDate").value;
      const timeStart = document.getElementById("mergeStart").value;
      const timeEnd = document.getElementById("mergeEnd").value;
      const camId = "{{ cam_id }}";

      if (!dateVal || !timeStart || !timeEnd) {
        alert("Vui lòng chọn ngày và giờ đầy đủ.");
        return;
      }

      const startFull = `${dateVal}T${timeStart}`;
      const endFull = `${dateVal}T${timeEnd}`;
      const startTime = new Date(startFull);
      const endTime = new Date(endFull);
      // Nếu giờ kết thúc nhỏ hơn hoặc bằng giờ bắt đầu, hiểu là ngày hôm sau.
      // Nhờ đó có thể ghép 23:00 → 00:30 mà vẫn dùng một ô chọn ngày.
      if (endTime <= startTime) endTime.setDate(endTime.getDate() + 1);
      const diffMins = (endTime - startTime) / 1000 / 60;

      if (diffMins > {{ max_merge_minutes|int }}) { alert("Chỉ được ghép tối đa {{ max_merge_minutes }} phút."); return; }

      document.getElementById("mergeProgressWrap").style.display = "block";
      document.getElementById("mergeResult").innerHTML = "";
      document.getElementById("mergeProgressBar").style.width = "0%";
      document.getElementById("mergeStatusText").innerText = "Đang xử lý...";

      const endRequest = `${endTime.getFullYear()}-${String(endTime.getMonth() + 1).padStart(2, "0")}-${String(endTime.getDate()).padStart(2, "0")}T${timeEnd}`;
      const url = `/merge?cam_id=${camId}&start=${encodeURIComponent(startFull)}&end=${encodeURIComponent(endRequest)}`;
      const evtSource = new EventSource(url);
      let mergeFinished = false;

      evtSource.onmessage = function(event) {
        const data = event.data;
        if (data.startsWith("notice:")) {
            document.getElementById("mergeStatusText").innerText = data.slice("notice:".length);
        } else if (data.startsWith("error:")) {
            mergeFinished = true;
            document.getElementById("mergeResult").innerHTML = `<p class="text-danger">❌ ${data.split(":")[1]}</p>`;
            document.getElementById("mergeProgressWrap").style.display = "none";
            evtSource.close();
        } else if (data.startsWith("done:")) {
            mergeFinished = true;
            const outputFile = data.split(":")[1];
            document.getElementById("mergeProgressBar").style.width = "100%";
            document.getElementById("mergeProgressBar").innerText = "Hoàn tất!";
            document.getElementById("mergeResult").innerHTML = `
              <p class="text-success fw-bold">✅ Ghép thành công!</p>
              <video src="/video/${outputFile}" controls class="mt-2 shadow" style="width:100%;border-radius:12px;"></video>
              <a class="btn btn-success mt-3" href="/download/${outputFile}" download>Tải về máy</a>
            `;
            evtSource.close();
        } else {
            const percent = parseInt(data);
            if (!isNaN(percent)) {
                document.getElementById("mergeProgressBar").style.width = percent + "%";
                document.getElementById("mergeProgressBar").innerText = percent + "%";
            }
        }
      };
      evtSource.onerror = function() {
        if (mergeFinished) return;
        mergeFinished = true;
        document.getElementById("mergeProgressWrap").style.display = "none";
        document.getElementById("mergeResult").innerHTML = '<p class="text-danger">❌ Mất kết nối khi ghép video. Hãy kiểm tra lại kết quả hoặc thử lại.</p>';
        evtSource.close();
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      const dateInput = document.getElementById("filterDate");
      const timeInput = document.getElementById("filterTime");
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      // Mặc định xem lại từ một giờ trước; dùng chính mốc này cho ngày để
      // hoạt động đúng cả khi mở trang ngay sau nửa đêm.
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const defaultDate = `${oneHourAgo.getFullYear()}-${pad(oneHourAgo.getMonth() + 1)}-${pad(oneHourAgo.getDate())}`;
      const defaultTime = `${pad(oneHourAgo.getHours())}:${pad(oneHourAgo.getMinutes())}`;


      document.getElementById("videoPlayer").addEventListener("ended", () => {
        const list = document.getElementById("videoList");
        const current = list.selectedOptions[0];
        const currentStart = current?.dataset.startAt;
        if (!currentStart) return;
        const nextOption = [...list.querySelectorAll('option[data-start-at]')]
          .filter(option => option.dataset.startAt > currentStart)
          .sort((a, b) => a.dataset.startAt.localeCompare(b.dataset.startAt))[0];
        if (!nextOption) return;
        selectVideo(Number(nextOption.dataset.timelineIndex));
        setTimeout(() => document.getElementById("videoPlayer").play().catch(() => {}), 0);
      });

      if (dateInput) {
        dateInput.value = defaultDate;
        dateInput.addEventListener("change", () => {
          recentWindowMode = false;
          if (isNvrSource()) fetchVideos(); else updateVideoList();
        });
      }

      const mergeDateInput = document.getElementById("mergeDate");
      const mergeDateDisplay = document.getElementById("mergeDateDisplay");
      const updateMergeDateDisplay = () => {
        if (!mergeDateInput || !mergeDateDisplay || !mergeDateInput.value) return;
        const [year, month, day] = mergeDateInput.value.split("-");
        mergeDateDisplay.innerText = `${day}/${month}/${year}`;
      };
      if (mergeDateInput) {
        mergeDateInput.value = defaultDate;
        updateMergeDateDisplay();
        mergeDateInput.addEventListener("change", updateMergeDateDisplay);
      }
      const shiftMergeDate = (days) => {
        if (!mergeDateInput || !mergeDateInput.value) return;
        const selectedDate = new Date(`${mergeDateInput.value}T00:00:00`);
        selectedDate.setDate(selectedDate.getDate() + days);
        mergeDateInput.value = `${selectedDate.getFullYear()}-${pad(selectedDate.getMonth() + 1)}-${pad(selectedDate.getDate())}`;
        updateMergeDateDisplay();
      };
      document.getElementById("prevMergeDate")?.addEventListener("click", () => shiftMergeDate(-1));
      document.getElementById("nextMergeDate")?.addEventListener("click", () => shiftMergeDate(1));

      if (timeInput) {
        timeInput.value = defaultTime;
        timeInput.addEventListener("change", () => {
          recentWindowMode = false;
          updateVideoList();
        });
      }

      fetchVideos();
    });
  </script>
</body>
</html>
