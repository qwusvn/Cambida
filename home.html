<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bg: {{ site.theme.background }}; --surface: {{ site.theme.surface }}; --primary: {{ site.theme.primary }}; --accent: {{ site.theme.accent }}; --text: {{ site.theme.text }}; }
    body { min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 15% 0, var(--surface), var(--bg) 55%); }
    .page { max-width:1050px; margin:auto; padding:48px 20px; }
    .brand { color:var(--accent); font-weight:800; letter-spacing:.06em; }
    .tagline { color:color-mix(in srgb, var(--text) 72%, transparent); }
    .cam-btn { background:linear-gradient(135deg,var(--surface),var(--primary)); border:1px solid color-mix(in srgb,var(--accent) 72%,transparent); border-radius:18px; color:var(--text); text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; height:145px; box-shadow:0 10px 25px rgba(0,0,0,.24); transition:transform .18s,box-shadow .18s; }
    .cam-btn:hover { transform:translateY(-4px); color:var(--text); box-shadow:0 16px 30px rgba(0,0,0,.34); }
    .admin-link { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <main class="page">
    <div class="d-flex justify-content-between align-items-start mb-5">
      <div><h1 class="brand mb-2">🎥 {{ site.name }}</h1><p class="tagline mb-0">{{ site.tagline }}</p></div>
      <div class="d-flex gap-3"><a class="admin-link" href="/live">📺 Xem trực tiếp</a><a class="admin-link" href="/timeline">🕒 Timeline</a><a class="admin-link" href="/admin">⚙️ Quản trị</a></div>
    </div>
    <div class="row g-4">
      {% for camera in cameras %}
      <div class="col-6 col-md-4 col-lg-3">
        <a href="/replay/cam{{ camera.id }}" class="cam-btn"><span style="font-size:2.6rem">📷</span><span class="fw-bold mt-2">{{ camera.name }}</span></a>
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
