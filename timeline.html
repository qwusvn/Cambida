<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem lại đa camera · {{ site.name }}</title>
<style>
:root{--bg:{{ site.theme.background }};--surface:{{ site.theme.surface }};--primary:{{ site.theme.primary }};--accent:{{ site.theme.accent }};--text:{{ site.theme.text }};--muted:#9aa4b2;--line:color-mix(in srgb,var(--text) 18%,transparent);--label:150px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) 245px}.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,black);flex-wrap:wrap}.brand{font-weight:700;color:var(--accent);margin-right:auto}.top input,.top select,.top button,.top a{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);padding:0 9px;text-decoration:none}.top button{cursor:pointer}.top .active{border-color:var(--accent);color:var(--accent)}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:8px;padding:8px}.viewer{min-height:0;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.viewer video{width:100%;height:100%;object-fit:contain}.viewer-empty{color:#8d96a4;text-align:center}.viewer-badge{position:absolute;left:10px;top:10px;background:#000b;padding:5px 8px;border-radius:6px;font-size:13px}.side{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px}.cam{width:100%;text-align:left;padding:9px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text);cursor:pointer;margin-bottom:5px}.cam:hover,.cam.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}.cam small{display:block;color:var(--muted);margin-top:2px}
.timeline{min-height:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,black);display:grid;grid-template-rows:38px minmax(0,1fr)}.tlbar{display:flex;align-items:center;gap:10px;padding:5px 10px;border-bottom:1px solid var(--line);font-size:13px}.legend{margin-left:auto;color:var(--muted)}.scroll{overflow:auto;position:relative}.canvas{--track:1200px;min-width:calc(var(--label) + var(--track));width:calc(var(--label) + var(--track));position:relative}.row{display:grid;grid-template-columns:var(--label) var(--track);min-height:36px}.label{position:sticky;left:0;z-index:4;padding:9px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.track{position:relative;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to right,transparent 0,transparent 59px,color-mix(in srgb,var(--text) 10%,transparent) 60px);cursor:crosshair}.ruler .track{height:34px;background:var(--surface)}.tick{position:absolute;top:0;bottom:0;border-left:1px solid color-mix(in srgb,var(--text) 20%,transparent);font-size:11px;color:var(--muted);padding-left:4px;padding-top:4px}.clip{position:absolute;top:5px;height:26px;min-width:4px;border:0;border-radius:4px;background:#198754;color:white;overflow:hidden;cursor:pointer}.clip.sel{outline:2px solid var(--accent)}.gap{position:absolute;top:0;bottom:0;background:rgba(220,53,69,.08);border-left:1px dashed rgba(220,53,69,.25)}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff365d;z-index:8;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #ff365d}.status{color:var(--muted)}
@media(max-width:800px){body{overflow:auto;height:auto}.app{height:auto;min-height:100vh;grid-template-rows:auto 55vh 250px}.workspace{grid-template-columns:1fr}.side{display:flex;gap:6px;overflow:auto}.cam{min-width:130px;margin:0}.timeline{min-height:250px}:root{--label:110px}}
</style>
</head><body>
<div class="app">
<header class="top"><div class="brand">▶ {{ site.name }} · Xem lại</div><a href="/">Trang chủ</a><input id="date" type="date"><button id="prev">‹</button><button id="next">›</button><button data-h="1">1 giờ</button><button data-h="3">3 giờ</button><button data-h="6">6 giờ</button><button data-h="24">24 giờ</button><select id="zoom"><option value="2">2 px/phút</option><option value="4" selected>4 px/phút</option><option value="8">8 px/phút</option><option value="16">16 px/phút</option></select><button id="now">Hiện tại</button></header>
<section class="workspace"><div class="viewer"><video id="video" controls preload="metadata"></video><div id="empty" class="viewer-empty">Chọn đoạn ghi hình trên timeline để phát lại</div><div id="badge" class="viewer-badge">Chưa chọn camera</div></div><aside class="side" id="cams"></aside></section>
<section class="timeline"><div class="tlbar"><strong>Timeline chung</strong><span id="range"></span><span class="legend">Xanh: có video · Đỏ nhạt: khoảng trống</span><span id="status" class="status"></span></div><div class="scroll" id="scroll"><div class="canvas" id="timelineContent"><div class="row ruler"><div class="label">Thời gian</div><div class="track" id="ruler"></div></div><div id="lanes"></div><div id="playhead" class="playhead"></div></div></div></section>
</div>
<script>
const cameras={{ cameras|tojson }}; const S={start:null,end:null,ppm:4,segments:[],cam:null,play:null,hours:3};
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'); const date=$('date'),video=$('video'),empty=$('empty'),badge=$('badge');
function inputDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function isoLocal(d){return `${inputDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function isoLocalSeconds(d){return `${isoLocal(d)}:${pad(d.getSeconds())}`}
function clock(d){return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function setWindow(hours=S.hours,base=new Date()){S.hours=hours;S.end=new Date(base);S.start=new Date(base.getTime()-hours*3600000);date.value=inputDate(S.end);load()}
function shift(dir){const ms=S.end-S.start;S.start=new Date(S.start.getTime()+dir*ms);S.end=new Date(S.end.getTime()+dir*ms);date.value=inputDate(S.end);load()}
function selectCam(id){S.cam=Number(id);document.querySelectorAll('.cam').forEach(b=>b.classList.toggle('sel',Number(b.dataset.id)===S.cam));badge.textContent=cameras.find(c=>Number(c.id)===S.cam)?.name||`Camera ${S.cam}`;render()}
function renderCams(){ $('cams').innerHTML=cameras.map(c=>`<button class="cam" data-id="${c.id}"><strong>${c.name}</strong><small>Camera ${c.id}</small></button>`).join(''); document.querySelectorAll('.cam').forEach(b=>b.onclick=()=>selectCam(b.dataset.id)) }
function render(){if(!S.start||!S.end)return;const mins=(S.end-S.start)/60000,track=Math.max(900,Math.ceil(mins*S.ppm));$('timelineContent').style.setProperty('--track',`${track}px`);$('range').textContent=`${clock(S.start)} → ${clock(S.end)}`; let ticks=''; const step=mins<=180?15:mins<=720?30:60;for(let m=0;m<=mins;m+=step){const d=new Date(S.start.getTime()+m*60000);ticks+=`<span class="tick" style="left:${m*S.ppm}px">${clock(d)}</span>`}$('ruler').innerHTML=ticks;
$('lanes').innerHTML=cameras.map(c=>{const segs=S.segments.filter(s=>Number(s.cam_id)===Number(c.id));let cur=0,g='',clips='';segs.forEach(s=>{const a=Math.max(0,(new Date(s.started_at)-S.start)/60000),b=Math.min(mins,(new Date(s.end_at)-S.start)/60000);if(b<=0||a>=mins)return;if(a>cur)g+=`<span class="gap" style="left:${cur*S.ppm}px;width:${(a-cur)*S.ppm}px"></span>`;cur=Math.max(cur,b);clips+=`<button class="clip ${S.cam===Number(c.id)?'sel':''}" data-cam="${c.id}" data-play="${encodeURIComponent(s.play_url||('/video/'+encodeURIComponent(s.filename)))}" data-source="${s.source||'local'}" data-start="${s.started_at}" data-end="${s.end_at}" style="left:${a*S.ppm}px;width:${Math.max(4,(b-a)*S.ppm)}px" title="${s.filename} · ${s.source||'local'}"></button>`});if(cur<mins)g+=`<span class="gap" style="left:${cur*S.ppm}px;width:${(mins-cur)*S.ppm}px"></span>`;return `<div class="row"><div class="label">${c.name}</div><div class="track" data-cam="${c.id}">${g}${clips}</div></div>`}).join('');document.querySelectorAll('.clip').forEach(b=>b.onclick=e=>{e.stopPropagation();const clipStart=new Date(b.dataset.start),clipEnd=new Date(b.dataset.end||b.dataset.start),rect=b.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/Math.max(1,rect.width)));S.play=new Date(clipStart.getTime()+Math.max(0,clipEnd-clipStart)*ratio);selectCam(b.dataset.cam);let playUrl=decodeURIComponent(b.dataset.play);if(b.dataset.source==='nvr'){playUrl+=`${playUrl.includes('?')?'&':'?'}at=${encodeURIComponent(isoLocalSeconds(S.play))}`;}video.src=playUrl;empty.style.display='none';video.load();video.play().catch(()=>{});positionPlay()});document.querySelectorAll('.track').forEach(t=>t.onclick=e=>{const r=t.getBoundingClientRect(),x=Math.max(0,Math.min(t.clientWidth,e.clientX-r.left));S.play=new Date(S.start.getTime()+x/S.ppm*60000);positionPlay()});positionPlay()}
function positionPlay(){if(!S.play||!S.start)return;const x=Math.max(0,Math.min((S.end-S.start)/60000,(S.play-S.start)/60000))*S.ppm;$('playhead').style.left=`calc(var(--label) + ${x}px)`}
async function load(){ $('status').textContent='Đang tải…';try{const r=await fetch(`/api/timeline?start=${encodeURIComponent(isoLocal(S.start))}&end=${encodeURIComponent(isoLocal(S.end))}`);const j=await r.json();if(!r.ok)throw Error(j.error||'Lỗi timeline');S.segments=Array.isArray(j.segments)?j.segments:[];render();$('status').textContent=`${S.segments.length} đoạn · ${j.source_mode||'local'}${(j.warnings||[]).length?' · '+j.warnings.length+' cảnh báo':''}`}catch(e){$('status').textContent=e.message;S.segments=[];render()}}
const initialCam=Number(new URLSearchParams(location.search).get('cam')); renderCams(); if(cameras.length)selectCam(cameras.some(c=>Number(c.id)===initialCam)?initialCam:cameras[0].id); document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>setWindow(Number(b.dataset.h)));$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('now').onclick=()=>setWindow(S.hours,new Date());$('zoom').onchange=e=>{S.ppm=Number(e.target.value);render()};date.onchange=()=>{const d=new Date(`${date.value}T23:59:00`);setWindow(S.hours,d)};setWindow(3,new Date());
</script></body></html>
