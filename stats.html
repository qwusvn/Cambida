<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê · {{ site.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1d2733; --muted:#64748b; --border:#d9e0e7; --primary:#1769aa; }
    body { background:var(--bg); color:var(--text); min-height:100vh; }
    .wrap { max-width:1100px; margin:auto; padding:30px 18px 60px; }
    .card { background:var(--card); border:1px solid var(--border); }
    .muted { color:var(--muted); }
    .period.active { background:var(--primary); color:#fff; }
    .bar { height:12px; background:#dceafa; border-radius:10px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--primary); border-radius:10px; }
  </style>
</head>
<body><main class="wrap">
  <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">📊 Thống kê tải video</h1><div class="muted">Theo dõi lượt tải theo ngày, tuần, tháng và năm</div></div><a class="btn btn-outline-secondary" href="/admin">Quay lại Admin</a></div>
  <div class="btn-group mb-4" role="group"><button class="btn btn-outline-primary period" data-days="1">Ngày</button><button class="btn btn-outline-primary period active" data-days="7">Tuần</button><button class="btn btn-outline-primary period" data-days="30">Tháng</button><button class="btn btn-outline-primary period" data-days="365">Năm</button></div>
  <div id="notice"></div>
  <div class="row g-3 mb-4"><div class="col-md-4"><div class="card p-3"><div class="muted">Tổng lượt tải</div><div class="h3 mb-0" id="total">—</div></div></div><div class="col-md-4"><div class="card p-3"><div class="muted">Camera có lượt tải</div><div class="h3 mb-0" id="cameraCount">—</div></div></div><div class="col-md-4"><div class="card p-3"><div class="muted">Khoảng thời gian</div><div class="h3 mb-0" id="periodText">Tuần</div></div></div></div>
  <div class="row g-4"><div class="col-lg-7"><div class="card p-3"><h2 class="h5">Lượt tải theo ngày</h2><div id="daily" class="mt-3"></div></div></div><div class="col-lg-5"><div class="card p-3"><h2 class="h5">Theo camera</h2><div id="byCam" class="mt-3"></div></div></div></div>
  <div class="card p-3 mt-4"><h2 class="h5">Video được tải nhiều</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Video</th><th class="text-end">Lượt tải</th></tr></thead><tbody id="topFiles"></tbody></table></div></div>
</main><script>
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let selectedDays = 7;
  function render(data) {
    const daily = data.by_day || [], byCam = data.by_cam || [], top = data.top_files || [];
    $('total').textContent = daily.reduce((sum, item) => sum + Number(item.count || 0), 0);
    $('cameraCount').textContent = byCam.length;
    const maxDay = Math.max(...daily.map(item => Number(item.count || 0)), 1);
    $('daily').innerHTML = daily.length ? daily.map(item => `<div class="d-flex align-items-center gap-2 mb-2"><span style="width:92px">${esc(item.day)}</span><div class="bar flex-grow-1"><span style="width:${Math.round(Number(item.count || 0) / maxDay * 100)}%"></span></div><strong style="width:42px;text-align:right">${esc(item.count)}</strong></div>`).join('') : '<span class="muted">Chưa có lượt tải.</span>';
    const maxCam = Math.max(...byCam.map(item => Number(item.count || 0)), 1);
    $('byCam').innerHTML = byCam.length ? byCam.map(item => `<div class="d-flex align-items-center gap-2 mb-2"><span style="width:75px">Camera ${esc(item.cam_id)}</span><div class="bar flex-grow-1"><span style="width:${Math.round(Number(item.count || 0) / maxCam * 100)}%"></span></div><strong>${esc(item.count)}</strong></div>`).join('') : '<span class="muted">Chưa có lượt tải.</span>';
    $('topFiles').innerHTML = top.length ? top.map(item => `<tr><td class="text-break">${esc(item.filename)}</td><td class="text-end">${esc(item.count)}</td></tr>`).join('') : '<tr><td colspan="2" class="muted">Chưa có dữ liệu.</td></tr>';
  }
  async function load(days) { selectedDays = days; const response = await fetch(`/stats/data?days=${days}`); if (!response.ok) { $('notice').innerHTML='<div class="alert alert-danger">Không đọc được dữ liệu thống kê.</div>'; return; } render(await response.json()); }
  document.querySelectorAll('.period').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('.period').forEach(item => item.classList.remove('active')); button.classList.add('active'); $('periodText').textContent=button.textContent; load(Number(button.dataset.days)); }));
  load(7);
</script></body></html>
